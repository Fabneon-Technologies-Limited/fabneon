server {
    root /var/www/fabneon.com/html;
    index index.html index.htm;
    
    server_name fabneon.com www.fabneon.com;

    # Security & HTTPS Enforcement Headers (Strict Transport Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression for Optimal Core Web Vitals
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Performance Caching for Vite Bundle Assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static Assets & Media Caching (including Open Graph banners)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # AI & Search Engine Discovery Files
    location ~ ^/(llms\.txt|llms-full\.txt|robots\.txt|sitemap\.xml|og-image\.(png|webp))$ {
        add_header Access-Control-Allow-Origin "*";
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Search Console Verification Files (Google & Bing HTML files)
    location ~ ^/(google[a-z0-9]+\.html|BingSiteAuth\.xml)$ {
        try_files $uri =404;
    }

    # SPA Clean URL Routing (Supports /case-study/*, /blog/*, /privacy, /terms)
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/fabneon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fabneon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Enforce HTTPS: Redirect HTTP to HTTPS (Port 80 -> Port 443 301 Permanent Redirect)
server {
    listen 80;
    listen [::]:80;
    server_name fabneon.com www.fabneon.com;
    return 301 https://fabneon.com$request_uri;
}
